name: Build Dropbear for Huawei B612-25d

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: "Build and publish even if this upstream version already has a release"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "17 5 * * 1"

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: dropbear-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: mkj/dropbear
  TARGET: arm-linux-gnueabi
  TARGET_CFLAGS: >-
    -march=armv7-a
    -mfpu=vfpv3-d16
    -mfloat-abi=softfp
  LIBXCRYPT_VERSION: "4.4.38"
  SSH_PORT: "22"

jobs:
  check-upstream:
    name: Check upstream Dropbear version
    runs-on: ubuntu-24.04

    outputs:
      upstream_tag: ${{ steps.upstream.outputs.tag }}
      upstream_version: ${{ steps.upstream.outputs.version }}
      release_tag: ${{ steps.upstream.outputs.release_tag }}
      should_release: ${{ steps.decision.outputs.should_release }}

    steps:
      - name: Find latest upstream Dropbear release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Checking upstream Dropbear"
          echo "============================================================"

          TAG="$(
            git ls-remote --tags --refs \
              "https://github.com/${UPSTREAM_REPO}.git" \
              'refs/tags/DROPBEAR_*' |
            awk -F/ '{print $3}' |
            sort -V |
            tail -n1
          )"

          if [[ -z "$TAG" ]]; then
            echo "ERROR: Could not determine latest Dropbear release tag."
            exit 1
          fi

          VERSION="${TAG#DROPBEAR_}"
          RELEASE_TAG="${TAG}_B612"

          echo "Upstream tag:     $TAG"
          echo "Upstream version: $VERSION"
          echo "Release tag:      $RELEASE_TAG"

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether GitHub release already exists
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release does not exist: $RELEASE_TAG"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to build
        id: decision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RELEASE: ${{ inputs.force_release || false }}
          RELEASE_EXISTS: ${{ steps.existing.outputs.exists }}
        run: |
          set -euo pipefail

          SHOULD_RELEASE=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FORCE_RELEASE" == "true" ]]; then
            SHOULD_RELEASE=true
            echo "Manual force release requested."
          elif [[ "$RELEASE_EXISTS" != "true" ]]; then
            SHOULD_RELEASE=true
            echo "No release exists for this upstream version."
          else
            echo "Release already exists and force release was not requested."
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

  build:
    name: Build ARMv7 soft-float Dropbear
    needs: check-upstream
    if: needs.check-upstream.outputs.should_release == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            autopoint \
            build-essential \
            binutils-arm-linux-gnueabi \
            gcc-arm-linux-gnueabi \
            ca-certificates \
            file \
            git \
            libtool \
            pkg-config \
            qemu-user \
            unzip \
            wget \
            xz-utils \
            zip

      - name: Checkout upstream Dropbear
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check-upstream.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "$UPSTREAM_TAG" \
            "https://github.com/${UPSTREAM_REPO}.git" \
            dropbear-src

          cd dropbear-src

          echo "Upstream commit:"
          git rev-parse HEAD

      - name: Prepare Dropbear build configuration
        shell: bash
        run: |
          set -euo pipefail

          cd dropbear-src

          cat > localoptions.h <<'EOF'
          #define DEFAULT_PATH "/system/xbin:/system/bin:/system/sbin:/sbin:/usr/sbin:/usr/bin:/bin"
          #define DEFAULT_ROOT_PATH "/system/xbin:/system/bin:/system/sbin:/sbin:/usr/sbin:/usr/bin:/bin"
          EOF

          echo "=== localoptions.h ==="
          cat localoptions.h

      - name: Build libxcrypt for ARM soft-float
        shell: bash
        env:
          LIBXCRYPT_VERSION: ${{ env.LIBXCRYPT_VERSION }}
        run: |
          set -euo pipefail

          rm -rf /opt/arm-sysroot
          sudo mkdir -p /opt/arm-sysroot

          cd /tmp

          wget -q \
            "https://github.com/bminor/libxcrypt/releases/download/v${LIBXCRYPT_VERSION}/libxcrypt-${LIBXCRYPT_VERSION}.tar.xz"

          tar -xf "libxcrypt-${LIBXCRYPT_VERSION}.tar.xz"

          cd "libxcrypt-${LIBXCRYPT_VERSION}"

          ./configure \
            --host="${TARGET}" \
            --build="$(gcc -dumpmachine)" \
            --prefix=/usr \
            --disable-shared \
            --enable-static \
            --disable-failure-tokens

          make -j"$(nproc)"

          make DESTDIR=/opt/arm-sysroot install

          echo "=== libcrypt.a ==="
          file /opt/arm-sysroot/usr/lib/libcrypt.a

          echo "=== libcrypt.a ARM object check ==="
          found=0

          while IFS= read -r obj; do
            if file "$obj" | grep -q 'ARM'; then
              echo "OK: $obj"
              found=1
              break
            fi
          done < <(ar t /opt/arm-sysroot/usr/lib/libcrypt.a)

          if [[ "$found" != "1" ]]; then
            echo "ERROR: libcrypt.a does not contain ARM objects."
            exit 1
          fi

      - name: Configure Dropbear
        shell: bash
        run: |
          set -euo pipefail

          cd dropbear-src

          export CC="${TARGET}-gcc"
          export AR="${TARGET}-ar"
          export RANLIB="${TARGET}-ranlib"
          export STRIP="${TARGET}-strip"

          export CFLAGS="${TARGET_CFLAGS}"
          export CPPFLAGS="${TARGET_CFLAGS}"
          export LDFLAGS="${TARGET_CFLAGS} -L/opt/arm-sysroot/usr/lib"
          export LIBS="-lcrypt"

          ./configure \
            --host="${TARGET}" \
            --build="$(gcc -dumpmachine)" \
            --enable-static \
            --disable-zlib

          echo "=== crypt support ==="

          if grep -q 'HAVE_CRYPT 1' config.h; then
            echo "OK: HAVE_CRYPT 1"
          else
            echo "ERROR: HAVE_CRYPT 1 not found."
            exit 1
          fi

      - name: Build Dropbear
        shell: bash
        run: |
          set -euo pipefail

          cd dropbear-src

          make -j"$(nproc)" \
            dropbear \
            dbclient \
            dropbearkey \
            dropbearconvert \
            scp

          make strip

      - name: Verify Dropbear binaries
        shell: bash
        run: |
          set -euo pipefail

          cd dropbear-src

          for bin in dropbear dbclient dropbearkey dropbearconvert scp; do
            echo
            echo "============================================================"
            echo "$bin"
            echo "============================================================"

            echo
            echo "=== file ==="
            file "$bin"

            echo
            echo "=== ELF header ==="
            readelf -h "$bin"

            echo
            echo "=== ARM attributes ==="
            readelf -A "$bin" || true

            echo
            echo "=== CPU architecture ==="
            readelf -A "$bin" | grep -E 'Tag_CPU_(name|arch|arch_profile)' || true

            echo
            echo "=== FPU ==="
            readelf -A "$bin" | grep 'Tag_FP_arch' || true

            echo
            echo "=== VFP argument passing ==="
            if readelf -A "$bin" | grep -q 'Tag_ABI_VFP_args'; then
              echo "ERROR: hard-float VFP argument passing detected."
              exit 1
            fi

            echo
            echo "=== EABI / soft-float ==="
            readelf -h "$bin" | grep -E 'Version5 EABI|soft-float ABI'

            echo
            echo "OK: $bin"
          done

      - name: Verify crypt symbols and dynamic dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd dropbear-src

          echo "=== crypt symbols ==="

          for bin in dropbear dbclient dropbearkey dropbearconvert scp; do
            echo "--- $bin ---"
            "${TARGET}-nm" "$bin" 2>/dev/null | grep -E '(^| )crypt(_r)?$' || true
          done

          echo
          echo "=== Dynamic dependencies ==="

          for bin in dropbear dbclient dropbearkey dropbearconvert scp; do
            echo "--- $bin ---"

            if readelf -l "$bin" | grep -q 'Requesting program interpreter'; then
              echo "ERROR: $bin has a dynamic loader."
              exit 1
            fi

            if readelf -d "$bin" | grep -q 'NEEDED'; then
              echo "ERROR: $bin has dynamic dependencies."
              readelf -d "$bin"
              exit 1
            fi

            echo "OK: $bin is statically linked."
          done

      - name: Verify password authentication support
        shell: bash
        run: |
          set -euo pipefail

          cd dropbear-src

          if grep -q 'HAVE_CRYPT 1' config.h; then
            echo "Password authentication support checks passed."
          else
            echo "ERROR: Password authentication support is not enabled."
            exit 1
          fi

      - name: ARM runtime smoke test through QEMU
        shell: bash
        run: |
          set -euo pipefail

          cd dropbear-src

          echo "=== QEMU ARM runtime smoke test ==="

          qemu-arm ./dropbear -h >/tmp/dropbear-help.txt 2>&1 || true

          if [[ ! -s /tmp/dropbear-help.txt ]]; then
            echo "ERROR: qemu-arm could not execute dropbear."
            exit 1
          fi

          echo "OK: ARM Dropbear executed successfully under qemu-arm."

          echo
          echo "=== dropbear help output ==="
          head -n 20 /tmp/dropbear-help.txt

      - name: Prepare release package
        id: package
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check-upstream.outputs.upstream_tag }}
          UPSTREAM_VERSION: ${{ needs.check-upstream.outputs.upstream_version }}
          RELEASE_TAG: ${{ needs.check-upstream.outputs.release_tag }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="DROPBEAR_${UPSTREAM_VERSION}_armv7_soft-float_static_B612-25d"
          PACKAGE_DIR="${PWD}/${PACKAGE_NAME}"

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"

          cp dropbear-src/dropbear "$PACKAGE_DIR/dropbear"
          cp dropbear-src/dropbearkey "$PACKAGE_DIR/dropbearkey"

          cp install-dropbear.sh "$PACKAGE_DIR/install-dropbear.sh"
          cp install-dropbear.bat "$PACKAGE_DIR/install-dropbear.bat"

          chmod 0755 "$PACKAGE_DIR/dropbear"
          chmod 0755 "$PACKAGE_DIR/dropbearkey"
          chmod 0755 "$PACKAGE_DIR/install-dropbear.sh"

          cat > "$PACKAGE_DIR/BUILD-INFO.txt" <<EOF
          Huawei B612-25d Dropbear Build

          Upstream repository: https://github.com/${UPSTREAM_REPO}
          Upstream tag: ${UPSTREAM_TAG}
          Upstream version: ${UPSTREAM_VERSION}

          Target: ${TARGET}
          CPU: ARMv7-A
          FPU: VFPv3-D16
          Float ABI: soft-float
          Compiler target: ${TARGET}

          libxcrypt: ${LIBXCRYPT_VERSION}

          Static linking: yes
          zlib: disabled

          Runtime binaries:
            dropbear
            dropbearkey

          Installers:
            install-dropbear.sh
            install-dropbear.bat

          The generated dropbear-start launcher is intentionally NOT included.
          It is generated by install-dropbear.sh for the target router.
          EOF

          echo "=== Release package ==="
          find "$PACKAGE_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

          (
            cd "$PACKAGE_DIR"
            zip -9 -r "../${PACKAGE_NAME}.zip" .
          )

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_zip=${PACKAGE_NAME}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.package.outputs.package_zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check-upstream.outputs.release_tag }}
          UPSTREAM_TAG: ${{ needs.check-upstream.outputs.upstream_tag }}
          UPSTREAM_VERSION: ${{ needs.check-upstream.outputs.upstream_version }}
          PACKAGE_ZIP: ${{ steps.package.outputs.package_zip }}
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          # Dropbear ${UPSTREAM_VERSION} for Huawei B612-25d

          Upstream Dropbear release: \`${UPSTREAM_TAG}\`

          Target:
          - ARMv7-A
          - VFPv3-D16
          - EABI5
          - soft-float ABI
          - statically linked

          Built with:
          - ${TARGET}
          - libxcrypt ${LIBXCRYPT_VERSION}
          - zlib disabled

          The package contains:
          - \`dropbear\`
          - \`dropbearkey\`
          - \`install-dropbear.sh\`
          - \`install-dropbear.bat\`
          - \`BUILD-INFO.txt\`

          The installer generates the target-specific \`dropbear-start\`
          launcher on the router and installs it through Huawei's
          \`/system/etc/autorun.sh\` boot hook.

          Runtime package:
          \`${PACKAGE_ZIP}\`
          EOF

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dropbear ${UPSTREAM_VERSION} - Huawei B612-25d" \
            --notes-file release-notes.md \
            "$PACKAGE_ZIP"
            

name: Build static Dropbear ARMv7 soft-float

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  TARGET: arm-linux-gnueabi

  TARGET_CFLAGS: >-
    -march=armv7-a
    -mfpu=vfpv3-d16
    -mfloat-abi=softfp

  LIBXCRYPT_VERSION: "4.4.38"

jobs:
  build:
    name: ARMv7 soft-float
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            autopoint \
            binutils \
            build-essential \
            file \
            gcc-arm-linux-gnueabi \
            git \
            libtool \
            make \
            pkg-config \
            wget \
            xz-utils

      - name: Find latest Dropbear release
        id: dropbear
        shell: bash
        run: |
          set -euo pipefail

          TAG="$(
            git ls-remote --tags --refs \
              https://github.com/mkj/dropbear.git \
              'refs/tags/DROPBEAR_*' |
            awk -F/ '{print $3}' |
            sort -V |
            tail -n 1
          )"

          test -n "$TAG"

          echo "Latest Dropbear release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout Dropbear
        env:
          DROPBEAR_TAG: ${{ steps.dropbear.outputs.tag }}
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "$DROPBEAR_TAG" \
            https://github.com/mkj/dropbear.git \
            dropbear

          cd dropbear

          git describe --tags --always
          git rev-parse HEAD
          
      - name: Configure Android PATH defaults
        working-directory: dropbear
        run: |
          set -euo pipefail

          cat > localoptions.h <<'EOF'
          #ifndef DROPBEAR_LOCALOPTIONS_H
          #define DROPBEAR_LOCALOPTIONS_H

          /*
           * Huawei B612s-25d / P750 Android 4.4.1
           *
           * Android system commands live in /system/bin and
           * Huawei utilities such as busyboxx live in /system/xbin.
           */
          #define DEFAULT_PATH "/system/xbin:/system/bin:/system/sbin:/sbin:/usr/sbin:/usr/bin:/bin"
          #define DEFAULT_ROOT_PATH "/system/xbin:/system/bin:/system/sbin:/sbin:/usr/sbin:/usr/bin:/bin"

          #endif
          EOF

          cat localoptions.h
          
      - name: Prepare ARM sysroot
        run: |
          set -euxo pipefail

          sudo mkdir -p \
            /opt/arm-sysroot/usr/include \
            /opt/arm-sysroot/usr/lib \
            /opt/arm-sysroot/lib

          sudo chown -R "$USER:$USER" /opt/arm-sysroot

          ${TARGET}-gcc --version | head -n 1
          ${TARGET}-gcc -print-sysroot

      - name: Download libxcrypt
        run: |
          set -euxo pipefail

          wget -q \
            "https://github.com/besser82/libxcrypt/releases/download/v${LIBXCRYPT_VERSION}/libxcrypt-${LIBXCRYPT_VERSION}.tar.xz"

          tar -xf "libxcrypt-${LIBXCRYPT_VERSION}.tar.xz"

          mv \
            "libxcrypt-${LIBXCRYPT_VERSION}" \
            libxcrypt

      - name: Build ARM libcrypt.a
        working-directory: libxcrypt
        env:
          CC: arm-linux-gnueabi-gcc
          AR: arm-linux-gnueabi-ar
          RANLIB: arm-linux-gnueabi-ranlib
          STRIP: arm-linux-gnueabi-strip
        run: |
          set -euo pipefail

          export CFLAGS="${TARGET_CFLAGS} -O2"
          export CPPFLAGS="${TARGET_CFLAGS}"
          export LDFLAGS="${TARGET_CFLAGS}"

          ./configure \
            --host="${TARGET}" \
            --build="$(gcc -dumpmachine)" \
            --prefix=/usr \
            --disable-shared \
            --enable-static \
            --disable-werror

          make -j"$(nproc)"

          make DESTDIR=/opt/arm-sysroot install

          test -f /opt/arm-sysroot/usr/lib/libcrypt.a
          test -f /opt/arm-sysroot/usr/include/crypt.h

          file /opt/arm-sysroot/usr/lib/libcrypt.a

      - name: Verify ARM libcrypt
        run: |
          set -euo pipefail

          FIRST_OBJECT="$(
            arm-linux-gnueabi-ar t \
              /opt/arm-sysroot/usr/lib/libcrypt.a |
            head -n 1
          )"

          rm -rf /tmp/libcrypt-check
          mkdir -p /tmp/libcrypt-check

          cd /tmp/libcrypt-check

          arm-linux-gnueabi-ar x \
            /opt/arm-sysroot/usr/lib/libcrypt.a \
            "$FIRST_OBJECT"

          file "$FIRST_OBJECT"

          file "$FIRST_OBJECT" |
            grep -E 'ARM|32-bit' >/dev/null

      - name: Configure Dropbear
        working-directory: dropbear
        env:
          CC: arm-linux-gnueabi-gcc
          AR: arm-linux-gnueabi-ar
          RANLIB: arm-linux-gnueabi-ranlib
          STRIP: arm-linux-gnueabi-strip
        run: |
          set -euo pipefail

          export CFLAGS="${TARGET_CFLAGS}"
          export CPPFLAGS="${TARGET_CFLAGS}"
          export LDFLAGS="${TARGET_CFLAGS} -L/opt/arm-sysroot/usr/lib"
          export LIBS="-lcrypt"

          cat > /tmp/test-crypt.c <<'EOF'
          #include <crypt.h>

          int main(void)
          {
              char *p = crypt("test", "xx");
              return p == 0;
          }
          EOF

          ${CC} \
            ${CFLAGS} \
            -I/opt/arm-sysroot/usr/include \
            /tmp/test-crypt.c \
            -L/opt/arm-sysroot/usr/lib \
            -Wl,-Bstatic \
            -lcrypt \
            -Wl,-Bdynamic \
            -o /tmp/test-crypt

          file /tmp/test-crypt

          ./configure \
            --host="${TARGET}" \
            --build="$(gcc -dumpmachine)" \
            --enable-static \
            --disable-zlib

      - name: Verify Dropbear crypt detection
        working-directory: dropbear
        run: |
          set -euo pipefail

          grep -q 'HAVE_CRYPT 1' config.h

      - name: Build static Dropbear
        working-directory: dropbear
        env:
          CC: arm-linux-gnueabi-gcc
          AR: arm-linux-gnueabi-ar
          RANLIB: arm-linux-gnueabi-ranlib
          STRIP: arm-linux-gnueabi-strip
        run: |
          set -euo pipefail

          export CFLAGS="${TARGET_CFLAGS}"
          export CPPFLAGS="${TARGET_CFLAGS}"
          export LDFLAGS="${TARGET_CFLAGS} -L/opt/arm-sysroot/usr/lib"
          export LIBS="-lcrypt"

          make -j"$(nproc)" \
            PROGRAMS="dropbear dbclient dropbearkey dropbearconvert scp"

          make strip

      - name: Verify binaries
        working-directory: dropbear
        run: |
          set -euo pipefail

          BINARIES="
            dropbear
            dbclient
            dropbearkey
            dropbearconvert
            scp
          "

          for binary in $BINARIES; do
            echo
            echo "============================================================"
            echo "$binary"
            echo "============================================================"

            test -f "$binary"

            file "$binary"

            arm-linux-gnueabi-readelf -h "$binary"
            arm-linux-gnueabi-readelf -A "$binary"
            arm-linux-gnueabi-readelf -l "$binary"

            if arm-linux-gnueabi-readelf -l "$binary" |
               grep -q 'Requesting program interpreter'; then
              echo "ERROR: $binary has a dynamic loader"
              exit 1
            fi

            if ! file "$binary" |
               grep -q 'ARM'; then
              echo "ERROR: $binary is not ARM"
              exit 1
            fi

            if arm-linux-gnueabi-readelf -d "$binary" |
               grep -q 'NEEDED'; then
              echo "ERROR: $binary has dynamic dependencies"
              exit 1
            fi
          done

      - name: Verify ARMv7 VFPv3-D16 soft-float ABI
        working-directory: dropbear
        run: |
          set -euo pipefail

          for binary in \
            dropbear \
            dbclient \
            dropbearkey \
            dropbearconvert \
            scp
          do
            echo
            echo "=== Checking $binary ==="

            ATTRS="$(arm-linux-gnueabi-readelf -A "$binary")"
            HEADER="$(arm-linux-gnueabi-readelf -h "$binary")"

            echo "$ATTRS"

            echo "$ATTRS" |
              grep -E 'Tag_CPU_arch:.*v7' >/dev/null || {
                echo "ERROR: $binary: Tag_CPU_arch is not v7"
                exit 1
              }

            echo "$ATTRS" |
              grep -E 'Tag_FP_arch:.*VFPv3-D16' >/dev/null || {
                echo "ERROR: $binary: Tag_FP_arch is not VFPv3-D16"
                exit 1
              }

            if echo "$ATTRS" |
               grep -q 'Tag_ABI_VFP_args: VFP registers'; then
              echo "ERROR: $binary uses hard-float VFP argument passing"
              exit 1
            fi

            echo "$HEADER" |
              grep -E 'Flags:.*Version5 EABI.*soft-float ABI' >/dev/null || {
                echo "ERROR: $binary is not Version5 EABI soft-float"
                exit 1
              }

            echo "OK: $binary"
          done

      - name: Verify password authentication support
        working-directory: dropbear
        run: |
          set -euo pipefail

          echo "=== crypt symbols ==="
          arm-linux-gnueabi-nm dropbear |
            grep -E '(^|[[:space:]])crypt(_r)?$' || true

          echo
          echo "=== Dynamic dependencies ==="

          if arm-linux-gnueabi-readelf -d dropbear |
             grep -q 'NEEDED'; then
            echo "ERROR: Dropbear has dynamic dependencies"
            exit 1
          fi

      - name: Prepare artifact
        env:
          DROPBEAR_TAG: ${{ steps.dropbear.outputs.tag }}
        working-directory: dropbear
        run: |
          set -euo pipefail

          mkdir -p ../artifact

          cp \
            dropbear \
            dbclient \
            dropbearkey \
            dropbearconvert \
            scp \
            ../artifact/

          cp \
            /opt/arm-sysroot/usr/lib/libcrypt.a \
            ../artifact/

          cp \
            /opt/arm-sysroot/usr/include/crypt.h \
            ../artifact/

          cat > ../artifact/BUILD-INFO.txt <<EOF
          Dropbear release: ${DROPBEAR_TAG}
          Dropbear commit: $(git rev-parse HEAD)

          libxcrypt: ${LIBXCRYPT_VERSION}

          Target:
            ARMv7-A
            EABI5
            soft-float ABI
            VFPv3-D16

          Compiler:
            $(arm-linux-gnueabi-gcc --version | head -n 1)

          Compiler target:
            $(arm-linux-gnueabi-gcc -dumpmachine)

          Compiler flags:
            ${TARGET_CFLAGS}

          Dropbear:
            static
            password authentication enabled
            zlib disabled
          EOF

          ls -lh ../artifact

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-${{ steps.dropbear.outputs.tag }}-armv7-softfp-static
          path: artifact/
          if-no-files-found: error
          retention-days: 30
